<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="600" height="750">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF8F3"/>
      <stop offset="100%" stop-color="#F5EEE4"/>
    </linearGradient>
  </defs>
  <rect width="600" height="750" fill="url(#bg)"/>
  <!-- Elegant border -->
  <rect x="24" y="24" width="552" height="702" fill="none" stroke="#E4D9CB" stroke-width="1"/>
  <rect x="30" y="30" width="540" height="690" fill="none" stroke="#E4D9CB" stroke-width="1"/>
  <!-- Corner accents -->
  <rect x="36" y="36" width="6" height="6" fill="#B8924A"/>
  <rect x="558" y="36" width="6" height="6" fill="#B8924A"/>
  <rect x="36" y="708" width="6" height="6" fill="#B8924A"/>
  <rect x="558" y="708" width="6" height="6" fill="#B8924A"/>
  <!-- Crown / Diamond Icon -->
  <g transform="translate(300, 320)">
    <polygon points="0,-45 40,0 0,45 -40,0" fill="none" stroke="#B8924A" stroke-width="1.8"/>
    <polygon points="0,-25 22,0 0,25 -22,0" fill="none" stroke="#E4D9CB" stroke-width="1"/>
    <line x1="0" y1="-65" x2="0" y2="65" stroke="#E4D9CB" stroke-width="1"/>
    <line x1="-65" y1="0" x2="65" y2="0" stroke="#E4D9CB" stroke-width="1"/>
    <circle cx="0" cy="0" r="4" fill="#B8924A"/>
  </g>
  <!-- Brand text -->
  <text x="300" y="420" font-family="'Montserrat', sans-serif" font-size="13" font-weight="600" letter-spacing="4" fill="#2B2522" text-anchor="middle">MINHA JEWELLERS</text>
  <text x="300" y="445" font-family="'Cormorant Garamond', serif" font-size="16" font-style="italic" fill="#B8924A" text-anchor="middle">Handcrafted Demi-Fine</text>
  <text x="300" y="475" font-family="'Montserrat', sans-serif" font-size="10" letter-spacing="2" fill="#6E625A" text-anchor="middle">ATELIER ARCHIVE</text>
